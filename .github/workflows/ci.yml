name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push to the same ref makes the in-flight run redundant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    # nimbus drives xcodebuild and simctl, so it only builds on macOS.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
